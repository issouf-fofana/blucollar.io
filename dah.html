<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>System Status – BlueCollar AI</title>
<meta name="color-scheme" content="light dark">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" href='data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64"><defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop stop-color="%2360a5fa"/><stop offset="1" stop-color="%2322d3ee"/></linearGradient></defs><rect width="64" height="64" rx="14" fill="url(%23g)"/><path d="M18 34h20a4 4 0 0 0 0-8H18m22 8v10" stroke="white" stroke-width="6" stroke-linecap="round" fill="none"/></svg>'/>
<style>
:root{
  --bg:#f7fafc; --panel:#ffffff; --soft:#f8fafc; --line:#e2e8f0;
  --text:#0f172a; --muted:#475569;
  --brand:#2563eb; --brand2:#06b6d4; --accent:#7c3aed; --ok:#10b981; --warn:#f59e0b; --err:#ef4444;
  --ring:0 0 0 3px rgba(37,99,235,.25); --shadow:0 15px 45px rgba(2,6,23,.08);
}
@media (prefers-color-scheme: dark){
  :root{
    --bg:#0b1020; --panel:#0f172a; --soft:#0c1428; --line:#1f2937;
    --text:#e2e8f0; --muted:#94a3b8;
    --brand:#60a5fa; --brand2:#22d3ee; --accent:#a78bfa; --ok:#34d399; --warn:#fbbf24; --err:#f87171;
    --ring:0 0 0 3px rgba(96,165,250,.45); --shadow:0 20px 50px rgba(2,6,23,.35);
  }
}
*{box-sizing:border-box} html,body{height:100%}
body{
  margin:0;font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Helvetica,Arial;
  color:var(--text);
  background:
    radial-gradient(900px 500px at 100% -20%, #22d3ee14, transparent 40%),
    radial-gradient(900px 500px at -10% 0%, #60a5fa18, transparent 45%),
    linear-gradient(180deg,var(--bg),var(--bg));
}

/* ============ LAYOUT (sidebar + content) ============ */
.app{display:grid;grid-template-columns:260px 1fr;min-height:100vh}
.sidebar{background:linear-gradient(180deg,var(--panel),var(--soft));border-right:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:.6rem;padding:18px 16px;font-weight:800;border-bottom:1px solid var(--line)}
.logo{width:32px;height:32px;border-radius:10px;background:
  radial-gradient(120% 120% at 30% 20%, var(--brand2), transparent 60%),
  linear-gradient(135deg,var(--brand),var(--accent)); box-shadow:0 8px 20px rgba(2,6,23,.12)}
.nav{padding:10px}
.nav h4{color:#94a3b8;font-size:12px;letter-spacing:.12em;text-transform:uppercase;margin:16px 12px 8px}
.link{display:flex;align-items:center;gap:.6rem;padding:12px 14px;border-radius:12px;color:#334155;text-decoration:none;border:1px solid transparent;transition:transform .15s ease}
.link:hover{background:color-mix(in lab,var(--brand) 7%, transparent);border-color:#c5d2f7;transform:translateY(-1px)}
.link.active{background:linear-gradient(180deg,#eff6ff,#eaf2ff);border-color:#c5d2f7;color:#0f172a;box-shadow:0 10px 24px rgba(2,6,23,.08)}
.icon{width:18px;height:18px;stroke:currentColor;stroke-width:1.7;fill:none}

/* topbar in content */
.content{background:transparent}
.topbar{display:flex;justify-content:space-between;align-items:center;padding:16px 24px;border-bottom:1px solid var(--line);backdrop-filter: blur(8px)}
.badges{display:flex;gap:8px;flex-wrap:wrap}
.badge{font-size:12px;background:#eef2ff;border:1px solid #dbe3ff;color:#374151;padding:6px 10px;border-radius:999px;display:flex;align-items:center;gap:6px}
.page{padding:24px}

/* ============ STATUS CARDS ============ */
.header{padding:18px 20px;border:1px solid var(--line);border-bottom:none;border-radius:16px 16px 0 0;background:var(--panel)}
.body{padding:18px 20px;border:1px solid var(--line);border-top:none;border-radius:0 0 16px 16px;background:var(--panel);box-shadow:var(--shadow)}
.h1{margin:0;font-size:28px}
.sub{margin:6px 0 0;color:var(--muted)}

.summary{display:flex;gap:12px;flex-wrap:wrap;align-items:center;background:linear-gradient(90deg,#eef6ff,#f2fbff);border:1px solid #dbeafe;padding:12px 14px;border-radius:12px;margin-top:14px}
.summary .pill{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:999px;font-size:12px;border:1px solid #cfe0ff;background:#fff}
.pill .d{width:8px;height:8px;border-radius:999px}
.controls{margin-left:auto;display:flex;gap:10px}
.btn{border:1px solid #cbd5e1;background:#fff;color:#334155;border-radius:10px;padding:8px 12px;cursor:pointer;font-weight:700}
.btn:hover{transform:translateY(-1px)}
.badge-mini{font-size:12px;padding:4px 8px;border-radius:999px;background:#103a28;border:1px solid #1d6b4e;color:#67e8f9}

.status-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:16px;margin-top:16px}
.status-card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow);transition:transform .15s, box-shadow .15s}
.status-card:hover{transform:translateY(-2px); box-shadow:0 18px 40px rgba(2,6,23,.12)}
.status-head{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:8px}
.status-name{font-weight:700}
.dot{width:9px;height:9px;border-radius:999px;background:#94a3b8}
.dot.ok{background:var(--ok);box-shadow:0 0 0 4px color-mix(in lab,var(--ok) 25%, transparent)}
.dot.warn{background:var(--warn);box-shadow:0 0 0 4px color-mix(in lab,var(--warn) 25%, transparent)}
.dot.err{background:var(--err);box-shadow:0 0 0 4px color-mix(in lab,var(--err) 25%, transparent)}
.dot.pulse{animation:pulse 1.4s ease-in-out infinite}
@keyframes pulse{0%{transform:scale(1)}50%{transform:scale(1.25)}100%{transform:scale(1)}}
.kv{font-size:12px;color:#556;display:flex;justify-content:space-between;margin-top:6px}
.spark{height:34px;width:100%;margin-top:8px}

/* toast */
.toast{position:fixed;right:22px;bottom:22px;background:#0b1226;border:1px solid #1d2d4c;color:#e2e8f0;padding:12px 14px;border-radius:12px;box-shadow:0 10px 30px rgba(2,6,23,.45);transform:translateY(18px);opacity:0;pointer-events:none;transition:.25s}
.toast.show{transform:none;opacity:1}

/* reveal */
.reveal{opacity:0;transform:translateY(8px)}
.reveal.in{opacity:1;transform:none;transition:opacity .6s ease, transform .6s ease}
 .link.disabled {
pointer-events: none;
opacity: 0.5;
cursor: not-allowed;
}
</style>
</head>
<body>

<section class="app">
  <!-- ===== SIDEBAR ===== -->
  <aside class="sidebar">
    <div class="brand"><div class="logo"></div><div>FS</div></div>
    <nav class="nav">
      <h4>Core Modules</h4>
      <a class="link" href="#" id="navFsm">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 7h18M5 7v12a2 2 0 0 0 2 2h10a2 2 0 0 0 2-2V7"/><path d="M8 7V5a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"/></svg>
        Field Service Management
      </a>
      <a class="link" href="#" id="navIntegration">
        <svg class="icon" viewBox="0 0 24 24"><path d="M10 13a5 5 0 0 0 7.07 0l2.83-2.83a5 5 0 0 0-7.07-7.07L11 4"/><path d="M14 11a5 5 0 0 0-7.07 0L4.1 13.83a5 5 0 0 0 7.07 7.07L13 20"/></svg>
        Work Order Integration
      </a>
      <a class="link disabled" href="#" id="navWarranty">
        <svg class="icon" viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v16l-3-2-3 2-3-2-3 2V5a2 2 0 0 1 2-2Z"/><path d="M8 10h8M8 14h8M8 6h8"/></svg>
        Warranty Processing
      </a>
      <a class="link" href="#" id="navAnswering">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 12a9 9 0 1 1 18 0"/><path d="M7 12v5a3 3 0 0 0 3 3h1"/><path d="M17 12v1a2 2 0 0 1-2 2h-1"/><path d="M7 12H5a2 2 0 0 0-2 2v1a2 2 0 0 0 2 2h2"/></svg>
        Answering Service Agent
      </a>

      <h4>System Management</h4>
      <a class="link active" href="#" id="navStatus">
        <svg class="icon" viewBox="0 0 24 24"><path d="M3 3v18h18"/><path d="M7 13v5"/><path d="M12 9v9"/><path d="M17 5v13"/></svg>
        System Status
        <span style="margin-left:auto;background:#103a28;border:1px solid #1d6b4e;color:#67e8f9;padding:2px 8px;border-radius:999px;font-size:12px">live</span>
      </a>
    </nav>
  </aside>

  <!-- ===== CONTENT ===== -->
  <main class="content">
    <div class="topbar">
      <div class="badges">
        <div class="badge">System Status</div>
        <div class="badge">Date: <span id="today"></span></div>
      </div>
    </div>

    <div class="page">
      <div class="header reveal">
        <h1 class="h1">Platform Health</h1>
        <p class="sub">Live health checks for your connected components. Auto-refresh every 60s.</p>
        <div class="summary" style="margin-top:12px">
          <div class="pill"><span class="d" style="background:var(--ok)"></span><span id="sumUp">0</span> Up</div>
          <div class="pill"><span class="d" style="background:var(--warn)"></span><span id="sumWarn">0</span> Warn</div>
          <div class="pill"><span class="d" style="background:var(--err)"></span><span id="sumDown">0</span> Down</div>
          <div class="pill" title="Last refresh">
            <svg class="d" viewBox="0 0 24 24" style="width:16px;height:16px;fill:none;stroke:#334155;stroke-width:2"><path d="M3 12a9 9 0 1 0 9-9"/><path d="M3 3v6h6"/></svg>
            <span id="lastRef">—</span>
          </div>
          <div class="controls">
            <button id="btnRefresh" class="btn" type="button">Refresh now</button>
            <span id="statusBadge" class="badge-mini">—</span>
          </div>
        </div>
      </div>

      <div class="body reveal">
        <div class="status-grid" id="statusGrid"><!-- cards injected --></div>
      </div>
    </div>
  </main>
</section>

<!-- Toast -->
<div id="toast" class="toast">Done.</div>

<script>
/* ===== ROUTES (mets les bons chemins S3/CloudFront) ===== */
const ROUTES = {
  answering: 'fsm_platform.html',
  mapping: 'Ecotrak+SF-api_payload_mapping.html'
};

/* ===== CONFIG (adapte si besoin) ===== */
const API_BASE = 'https://agtetwml50.execute-api.us-east-1.amazonaws.com/prod';
const API_PATH = '/api/chat';
const STATUS_TARGETS = [
  { key:'api',     name:'API Gateway',          kind:'http', url: `${API_BASE}${API_PATH}`, method:'OPTIONS' },
  { key:'lambda',  name:'Lambda Orchestrator',  kind:'http', url: `${API_BASE}${API_PATH}`, method:'GET' },
  { key:'s3',      name:'S3 Website',           kind:'http', url: `${location.origin}/favicon.ico`, method:'GET' },
  { key:'email',   name:'Email Pipeline (SES)', kind:'hint', url:'', method:'' },
  { key:'fusion',  name:'Service Fusion Link',  kind:'hint', url:'', method:'' },
  { key:'ecotrak', name:'Ecotrak Integration',  kind:'hint', url:'', method:'' },
];

/* ===== Utilities ===== */
const $ = s=>document.querySelector(s);
$('#today').textContent = new Date().toLocaleDateString();
const toast = (msg)=>{ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),2600); };
const io = new IntersectionObserver((es)=>es.forEach(e=>e.isIntersecting&&e.target.classList.add('in')), {threshold:.1});
document.querySelectorAll('.reveal').forEach(el=>io.observe(el));

/* ===== Sidebar actions ===== */
$('#navAnswering').onclick = (e)=>{ e.preventDefault(); window.location.href = ROUTES.answering; };
$('#navIntegration').onclick = (e)=>{ e.preventDefault(); window.location.href = ROUTES.mapping; };
$('#navFsm').onclick = (e)=>{ e.preventDefault(); toast('Field Service Management — coming soon'); };
$('#navWarranty').onclick = (e)=>{ e.preventDefault(); toast('Warranty Processing — coming soon'); };
$('#navStatus').onclick = (e)=>{ e.preventDefault(); window.scrollTo({top:0,behavior:'smooth'}); };

/* ===== Build cards ===== */
const grid = $('#statusGrid');
const historyMap = new Map(); // key -> [latencies]
function makeCard(t){
  const el = document.createElement('div');
  el.className = 'status-card';
  el.innerHTML = `
    <div class="status-head">
      <div class="status-name">${t.name}</div>
      <div class="dot pulse" id="dot-${t.key}"></div>
    </div>
    <svg class="spark" viewBox="0 0 120 34" preserveAspectRatio="none" id="spark-${t.key}"></svg>
    <div class="kv"><span>Latency</span><span id="lat-${t.key}">–</span></div>
    <div class="kv"><span>Last check</span><span id="ts-${t.key}">—</span></div>
  `;
  grid.appendChild(el);
  historyMap.set(t.key, Array.from({length:24}, ()=> NaN));
}
STATUS_TARGETS.forEach(makeCard);

function drawSpark(key){
  const el = document.getElementById(`spark-${key}`);
  const data = historyMap.get(key) || [];
  const nums = data.map(v=> isFinite(v) ? Math.min(800, Math.max(0, v)) : 800);
  const max = Math.max(...nums, 800);
  const pts = nums.map((v,i)=>{
    const x = (i/(nums.length-1))*120;
    const y = 32 - (v/max)*28;
    return `${x.toFixed(1)},${y.toFixed(1)}`;
  }).join(' ');
  el.innerHTML = `<polyline points="${pts}" fill="none" stroke="url(#g${key})" stroke-width="2"></polyline>
  <defs><linearGradient id="g${key}" x1="0" y1="0" x2="1" y2="0"><stop stop-color="#2563eb"/><stop offset="1" stop-color="#06b6d4"/></linearGradient></defs>`;
}

/* ===== Checks ===== */
async function check(t){
  const dot = document.getElementById(`dot-${t.key}`);
  const lat = document.getElementById(`lat-${t.key}`);
  const ts  = document.getElementById(`ts-${t.key}`);
  dot.className = 'dot pulse';
  const start = performance.now();
  let status = 'warn', ms = NaN;

  try{
    if(t.kind === 'http'){
      await fetch(t.url, { method:t.method||'GET', mode:'no-cors', cache:'no-store' });
      ms = Math.round(performance.now() - start);
      status = (ms < 1200) ? 'ok' : 'warn';
    }else{
      status = 'warn';
      ms = NaN;
    }
  }catch{
    status = 'err';
    ms = NaN;
  }
  dot.className = `dot ${status}`;
  lat.textContent = isFinite(ms) ? `${ms} ms` : 'n/a';
  ts.textContent = new Date().toLocaleTimeString();

  const arr = historyMap.get(t.key) || [];
  arr.push(ms); if(arr.length>24) arr.shift();
  historyMap.set(t.key, arr);
  drawSpark(t.key);
  return status;
}

async function refreshAll(){
  const results = await Promise.all(STATUS_TARGETS.map(check));
  const up   = results.filter(x=>x==='ok').length;
  const warn = results.filter(x=>x==='warn').length;
  const down = results.filter(x=>x==='err').length;
  $('#sumUp').textContent = up; $('#sumWarn').textContent = warn; $('#sumDown').textContent = down;
  $('#lastRef').textContent = new Date().toLocaleTimeString();
  const badge = $('#statusBadge');
  badge.textContent = `${up}/${STATUS_TARGETS.length}`;
  badge.style.background = down ? '#3b0d0d' : '#103a28';
  badge.style.borderColor = down ? '#7f1d1d' : '#1d6b4e';
  badge.style.color = down ? '#fecaca' : '#67e8f9';
}
$('#btnRefresh').onclick = refreshAll;

STATUS_TARGETS.forEach(t=>drawSpark(t.key));
refreshAll();
setInterval(refreshAll, 60000);
</script>
</body>
</html>
